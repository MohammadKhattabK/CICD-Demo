
name: Post-Deployment Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  smoke-test:
    name: Check Deployed API
    runs-on: ubuntu-latest

    steps:
      - name: Check API Liveness
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 30 \
            https://cicd-demo-api-cdyb.onrender.com/health/live

      - name: Check API Readiness
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 30 \
            https://cicd-demo-api-cdyb.onrender.com/health/ready
