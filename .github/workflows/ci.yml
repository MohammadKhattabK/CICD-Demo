
name: CICD-Demo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend
        run: dotnet restore src/Backend/CICD.Demo.Api/CICD.Demo.Api.csproj

      - name: Restore Tests
        run: dotnet restore src/Backend/CICD.Demo.Api.Tests/CICD.Demo.Api.Tests.csproj

      - name: Build Backend
        run: dotnet build src/Backend/CICD.Demo.Api/CICD.Demo.Api.csproj --configuration Release --no-restore

      - name: Run Backend Tests
        run: dotnet test src/Backend/CICD.Demo.Api.Tests/CICD.Demo.Api.Tests.csproj --configuration Release --no-restore

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Frontend/cicd-demo-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm run test:unit -- --run

      - name: Build Frontend
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm run build
