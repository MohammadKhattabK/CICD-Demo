
name: CICD-Demo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cicd_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend
        run: dotnet restore src/Backend/CICD.Demo.Api/CICD.Demo.Api.csproj

      - name: Restore Tests
        run: dotnet restore src/Backend/CICD.Demo.Api.Tests/CICD.Demo.Api.Tests.csproj

      - name: Build Backend
        run: dotnet build src/Backend/CICD.Demo.Api/CICD.Demo.Api.csproj --configuration Release --no-restore

      - name: Run Backend Tests
        env:
          # Enables the test that applies EF migrations to a real PostgreSQL.
          TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=cicd_test;Username=postgres;Password=postgres
        run: dotnet test src/Backend/CICD.Demo.Api.Tests/CICD.Demo.Api.Tests.csproj --configuration Release --no-restore

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Frontend/cicd-demo-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm ci

      - name: Check Frontend Formatting
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm run format:check

      - name: Run Frontend Tests
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm run test:unit -- --run

      - name: Lint Frontend
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm run lint 

      - name: Build Frontend
        working-directory: src/Frontend/cicd-demo-frontend
        run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build API Image
        run: docker build --tag cicd-demo-api:ci src/Backend/CICD.Demo.Api

      - name: Build Frontend Image
        run: >-
          docker build
          --build-arg VITE_API_BASE_URL=http://localhost:5080
          --tag cicd-demo-frontend:ci
          src/Frontend/cicd-demo-frontend

      - name: Validate Compose File
        run: docker compose config --quiet
